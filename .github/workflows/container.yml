name: Build container

# Builds env/docker/Dockerfile for linux/amd64 and linux/arm64 and publishes a
# multi-arch image to GitHub Container Registry. Reviewers then pull instead of
# building:
#
#     singularity pull thor.sif docker://ghcr.io/<owner>/thor:latest
#
# Runs on demand, and on version tags. It deliberately does NOT run on every
# push: the image is large and each build takes a long time.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Cheap guard: the Dockerfile, the Apptainer recipe and requirements.txt all
  # pin versions by hand. Catch them drifting apart before spending an hour
  # building.
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned versions across the three files
        run: python3 .github/scripts/check_pins.py

  build:
    needs: check-pins
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The base image alone is several GB and the result is well over 10 GB.
      # Hosted runners do not have room without clearing the preinstalled
      # toolchains first.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (registry requires lowercase)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner}/thor" >> "$GITHUB_OUTPUT"

      # Build and push by digest; the digests are merged into one multi-arch
      # tag by the `manifest` job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}#"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${owner}/thor"

          # Tag as the git tag when there is one, plus latest.
          tags=("latest")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${GITHUB_REF#refs/tags/}")
          fi

          refs=()
          for f in /tmp/digests/*; do
            refs+=("${image}@$(basename "$f" | sed 's/#$//')")
          done

          args=()
          for t in "${tags[@]}"; do args+=("--tag" "${image}:${t}"); done

          docker buildx imagetools create "${args[@]}" "${refs[@]}"

          for t in "${tags[@]}"; do
            echo "=== ${image}:${t}"
            docker buildx imagetools inspect "${image}:${t}"
          done
